<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#11151d" />
  <title>Slime Room Prototype v7</title>
  <link rel="stylesheet" href="style.css?v=7" />
</head>
<body>
  <main id="gameWrap">
    <section id="stageArea">
      <div id="stageFrame">
        <canvas id="game" width="960" height="540" aria-label="スライムアクションゲーム"></canvas>

        <div id="hud">
          <div id="message">敵を全員気絶させると扉が開きます</div>
          <button id="resetBtn" type="button">やり直し</button>
        </div>
      </div>
    </section>

    <section id="controlDeck" aria-label="スマホ操作">
      <div id="joystick" aria-label="移動スティック" role="application">
        <div class="stick-guide"></div>
        <div id="stickKnob"></div>
      </div>

      <div class="actions">
        <button class="action dash" data-key="dash" type="button">ダッシュ</button>
        <button class="action jump" data-key="jump" type="button">ジャンプ</button>
        <button class="action stick" data-key="stick" type="button">くっつき</button>
      </div>
    </section>
  </main>

  <script src="game.js?v=7"></script>
</body>
</html>
